[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop"
version = "0.1.0"
description = "配置驱动的浏览器 RPA 骨架：YAML 流程 + Playwright 执行 + 单文件 HTML 报告"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sop = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*"]
