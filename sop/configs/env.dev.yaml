name: dev
base_url: https://www.saucedemo.com

# 流程里用 {{env.username}} / {{env.password}} 引用。
# ${VAR} 会在加载时读取进程环境变量；变量名含 PASS/SECRET/TOKEN/KEY 的值会自动脱敏。
vars:
  username: admin
  password: ${SAUCEDEMO_PASSWORD}

browser:
  viewport: [1440, 900]
  locale: en-US
  slow_mo: 0
  # SauceDemo 使用 data-test 而非默认的 data-testid
  test_id_attribute: data-test
